services:
  postgres:
    image: postgres:16
    container_name: pharmacy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-pharmacy}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pharmacy}
      POSTGRES_DB: ${PG_DATABASE:-pharmacy}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: pharmacy-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
